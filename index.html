<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>VagasLocal - Encontre empregos na sua cidade</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
        VagasLocal
      </a>
      
      <button class="menu-toggle" onclick="toggleMenu()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      
      <nav class="nav" id="nav">
        <a href="index.html">Vagas</a>
        <a href="login.html" class="btn btn-primary">Entrar</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1>Encontre seu próximo emprego</h1>
      <p>As melhores oportunidades da sua região</p>
    </div>
  </section>

  <!-- Filtros -->
  <div class="container">
    <div class="filtros">
      <div class="filtros-grid">
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="busca" placeholder="Cargo, palavra-chave...">
        </div>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          <input type="text" id="cidade" placeholder="Cidade">
        </div>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <select id="tipoContrato">
            <option value="">Tipo de contrato</option>
            <option value="CLT">CLT</option>
            <option value="PJ">PJ</option>
            <option value="Estágio">Estágio</option>
            <option value="Freelancer">Freelancer</option>
          </select>
        </div>
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <select id="modalidade">
            <option value="">Modalidade</option>
            <option value="Presencial">Presencial</option>
            <option value="Remoto">Remoto</option>
            <option value="Híbrido">Híbrido</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary w-full" onclick="filtrarVagas()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        Buscar Vagas
      </button>
    </div>
  </div>

  <!-- Lista de Vagas -->
  <div class="container">
    <div id="vagas-container" class="vagas-grid">
      <!-- Vagas serão carregadas aqui -->
    </div>
    <div id="sem-vagas" class="text-center hidden" style="padding: 3rem 1rem;">
      <h3 style="margin-bottom: 0.5rem;">Nenhuma vaga encontrada</h3>
      <p style="color: var(--gray);">Tente ajustar os filtros ou buscar outra cidade</p>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/vagas.js"></script>
  <script src="js/app.js"></script>
  <script>
    function toggleMenu() {
      const nav = document.getElementById('nav');
      nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
      nav.style.position = 'absolute';
      nav.style.top = '100%';
      nav.style.left = '0';
      nav.style.right = '0';
      nav.style.flexDirection = 'column';
      nav.style.background = 'white';
      nav.style.padding = '1rem';
      nav.style.boxShadow = 'var(--shadow-lg)';
      nav.style.zIndex = '99';
    }
  </script>
</body>
</html>
