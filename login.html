<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Entrar - VagasLocal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="text-center mb-4">
        <a href="index.html" class="logo" style="justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          VagasLocal
        </a>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="mostrarTab('login')">Entrar</button>
        <button class="tab" onclick="mostrarTab('cadastro')">Cadastrar</button>
      </div>

      <!-- Login -->
      <form id="form-login" onsubmit="fazerLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="login-senha" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full">Entrar</button>
      </form>

      <!-- Cadastro -->
      <form id="form-cadastro" class="hidden" onsubmit="fazerCadastro(event)">
        <div class="form-group">
          <label>Tipo de conta</label>
          <select id="cad-tipo" onchange="toggleEmpresaFields()" required>
            <option value="candidato">Candidato</option>
            <option value="empresa">Empresa</option>
          </select>
        </div>
        <div class="form-group">
          <label id="label-nome">Nome completo</label>
          <input type="text" id="cad-nome" required placeholder="Seu nome">
        </div>
        <div class="form-group hidden" id="empresa-fields">
          <label>Nome da empresa</label>
          <input type="text" id="cad-nome-empresa" placeholder="Nome da empresa">
          <label class="mt-2">CNPJ</label>
          <input type="text" id="cad-cnpj" placeholder="00.000.000/0000-00">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="cad-email" required placeholder="seu@email.com">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Cidade</label>
            <input type="text" id="cad-cidade" required placeholder="Sua cidade">
          </div>
          <div class="form-group">
            <label>Estado</label>
            <input type="text" id="cad-estado" required maxlength="2" placeholder="SP" style="text-transform: uppercase;">
          </div>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="cad-senha" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="btn btn-primary w-full">Criar conta</button>
      </form>

      <div id="auth-mensagem"></div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function mostrarTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      if (tab === 'login') {
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-cadastro').classList.add('hidden');
      } else {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-cadastro').classList.remove('hidden');
      }
    }

    function toggleEmpresaFields() {
      const tipo = document.getElementById('cad-tipo').value;
      const fields = document.getElementById('empresa-fields');
      const label = document.getElementById('label-nome');
      
      if (tipo === 'empresa') {
        fields.classList.remove('hidden');
        label.textContent = 'Nome do responsável';
      } else {
        fields.classList.add('hidden');
        label.textContent = 'Nome completo';
      }
    }
  </script>
</body>
</html>
